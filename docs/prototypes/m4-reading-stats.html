<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>阅读统计</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d8d8d8; font-family: "Noto Serif SC", "Source Han Serif SC", serif; }
  .screen {
    width: 480px; height: 800px; margin: 24px auto; background: #f4f1ea;
    color: #111; position: relative; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  .tabs { height: 66px; display: flex; align-items: center; justify-content: space-around;
    border-bottom: 1px solid #111; padding: 0 8px; }
  .tabs span { width: 28px; height: 28px; display: block; border: 1.5px solid #111; border-radius: 4px; }
  .tabs .on { background: #111; }
  .page { padding: 14px 20px 44px; }
  h1 { font-size: 22px; font-weight: 700; margin: 2px 0 12px; }
  .hero { background: #e7e3d9; border: 1px solid #222; border-radius: 16px; padding: 12px;
    display: flex; gap: 14px; min-height: 132px; }
  .cover { width: 78px; height: 108px; background: #cfc9bc; border: 1px solid #222; flex: none; }
  .meta { flex: 1; display: flex; flex-direction: column; }
  .title { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .author { font-size: 13px; margin-top: 6px; }
  .progress { margin-top: auto; }
  .prow { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar { height: 4px; border: 1px solid #111; }
  .bar i { display: block; width: 19%; height: 100%; background: #111; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .card { background: #e7e3d9; border: 1px solid #222; border-radius: 16px; min-height: 86px;
    padding: 14px 14px 12px; }
  .val { font-size: 26px; font-weight: 700; line-height: 1; }
  .lab { font-size: 12px; margin-top: 8px; }
  .donut-card { margin-top: 12px; background: #e7e3d9; border: 1px solid #222; border-radius: 16px;
    height: 168px; display: flex; align-items: center; justify-content: center; }
  .donut { width: 118px; height: 118px; border-radius: 50%; border: 4px solid #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f4f1ea; }
  .donut .val { font-size: 24px; }
  .donut .lab { margin-top: 4px; }
  .bat { position: absolute; right: 18px; bottom: 16px; font-size: 12px; }
</style>
</head>
<body>
<div class="screen">
  <div class="tabs"><span></span><span></span><span></span><span></span><span class="on"></span></div>
  <div class="page">
    <h1>阅读统计</h1>
    <div class="hero">
      <div class="cover"></div>
      <div class="meta">
        <div class="title">重生之大涅槃</div>
        <div class="author">奥尔良烤鲟鱼堡</div>
        <div class="progress">
          <div class="prow"><span>全书进度</span><span>19%</span></div>
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <div class="grid">
      <div class="card"><div class="val">20m</div><div class="lab">总时长</div></div>
      <div class="card"><div class="val">10m</div><div class="lab">平均会话</div></div>
      <div class="card"><div class="val">2</div><div class="lab">阅读次数</div></div>
      <div class="card"><div class="val">0</div><div class="lab">连续阅读</div></div>
    </div>
    <div class="donut-card">
      <div class="donut"><div class="val">0%</div><div class="lab">每日目标</div></div>
    </div>
    <div class="grid">
      <div class="card"><div class="val">0</div><div class="lab">读完书籍</div></div>
      <div class="card"><div class="val">3</div><div class="lab">开始书籍</div></div>
    </div>
  </div>
  <div class="bat">80%</div>
</div>
</body>
</html>
