<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossPoint Reader · 正在阅读 / 手账 / 阅读统计 优化方案</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: #111311;
      color: #e8e9e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px),
        #121412;
      background-size: 28px 28px;
    }

    button, select, input { font: inherit; color: inherit; }
    .ink-app button { color: var(--ink); }

    /* Prototype Rig Container */
    .prototype-lab {
      --accent: #d35400;
      --accent-soft: rgba(211, 84, 0, 0.15);
      --screen-width: 480px;
      --screen-height: 800px;
      --safe-top: 9px;
      --safe-right: 3px;
      --safe-bottom: 3px;
      --safe-left: 3px;
      --shell: #1b1d1a;
      --shell-edge: #383c36;
      --control: #0c0e0c;
      --control-edge: #52584e;
      --ink: #111210;
      --ink-muted: #5e625a;
      --ink-light: #888d84;
      --paper: #fcfbfa;
      --paper-pure: #ffffff;
      --paper-bar: #e5e3dd;
      --serif: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", SimSun, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr;
    }

    .prototype-lab[data-shell="white"] {
      --shell: #e4e2da;
      --shell-edge: #faf8f2;
      --control: #bebeb4;
      --control-edge: #ffffff;
    }

    /* Top Lab Header */
    .lab-header {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 16px 28px;
      border-bottom: 1px solid #2d302b;
      background: rgba(18, 20, 18, 0.94);
      backdrop-filter: blur(8px);
    }

    .identity { display: flex; gap: 14px; align-items: center; }
    .identity-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid #737a6e;
      color: #e67e22;
      font: 800 14px/1 Georgia, serif;
      letter-spacing: -.05em;
      border-radius: 6px;
    }
    .identity p {
      color: #8c9288;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .identity h1 {
      font: 600 19px/1.2 -apple-system, sans-serif;
      letter-spacing: .02em;
      color: #f1f2ec;
    }

    .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    .control { display: grid; gap: 4px; }
    .control label {
      color: #82877e;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .control select {
      min-height: 32px;
      padding: 0 28px 0 10px;
      border: 1px solid #43473f;
      border-radius: 4px;
      background: #1d201c;
      color: #f1f1eb;
      font-size: 12px;
      cursor: pointer;
    }
    .control select:focus { outline: 1px solid var(--accent); }

    .safe-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid #43473f;
      border-radius: 4px;
      background: #1d201c;
      color: #c8cbc2;
      font-size: 12px;
      cursor: pointer;
    }
    .safe-toggle input { accent-color: var(--accent); }

    /* Lab Body */
    .lab-body {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 0;
    }

    /* Left Aside Panel */
    .readout {
      padding: 24px 22px;
      border-right: 1px solid #2d302b;
      background: rgba(20, 23, 20, 0.88);
      overflow-y: auto;
      max-height: calc(100vh - 73px);
    }
    .readout h2 {
      margin: 0 0 14px;
      color: #92998d;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    /* View Switcher Tabs */
    .screen-nav {
      display: grid;
      gap: 6px;
      margin-bottom: 20px;
    }
    .screen-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #363b33;
      border-radius: 6px;
      background: #181b17;
      color: #b8bcb2;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all .15s ease;
    }
    .screen-nav-btn:hover { background: #222621; color: #fff; }
    .screen-nav-btn.active {
      background: #2a3128;
      border-color: #65705f;
      color: #f7f8f4;
      font-weight: 600;
    }
    .screen-nav-btn .num {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      background: #272c25;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      color: #9ea597;
    }
    .screen-nav-btn.active .num {
      background: var(--accent);
      color: #fff;
    }

    /* Version / Comparison Switcher */
    .mode-switch-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 18px;
    }
    .mode-btn {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid #43483f;
      border-radius: 5px;
      background: #1c1f1b;
      color: #a4aaa0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
    }
    .mode-btn:hover { color: #fff; }
    .mode-btn.active {
      background: #2d3829;
      border-color: #63775d;
      color: #8ae474;
    }
    .mode-btn[data-mode="current"].active {
      background: #392823;
      border-color: #8c564c;
      color: #f39c89;
    }

    /* Explanation & Specs */
    .expl-box {
      margin: 14px 0 20px;
      padding: 12px 14px;
      border-radius: 6px;
      background: #171a16;
      border-left: 3px solid var(--accent);
      color: #c0c6ba;
      font-size: 12px;
      line-height: 1.55;
    }
    .expl-box h4 {
      margin: 0 0 6px;
      color: #eceee8;
      font-size: 12px;
      font-weight: 700;
    }
    .expl-box ul { padding-left: 18px; margin: 6px 0 0; }
    .expl-box li { margin-bottom: 4px; }

    .metric-row {
      padding: 10px 0;
      border-top: 1px solid #2f342d;
    }
    .metric-row .label {
      color: #787e74;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-row .val {
      margin-top: 4px;
      color: #edece4;
      font-size: 13px;
      font-weight: 500;
    }

    /* Stage Viewport */
    .stage-viewport {
      position: relative;
      min-width: 0;
      min-height: 640px;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .stage-viewport::before {
      content: "E-INK LOGICAL CANVAS · NATIVE PIXELS";
      position: absolute;
      top: 14px;
      right: 18px;
      color: #555b52;
      font-size: 9px;
      letter-spacing: .14em;
    }

    .device-sizer { position: relative; }
    .device-frame {
      position: absolute;
      inset: 0 auto auto 0;
      width: max-content;
      height: max-content;
      padding: 34px;
      border: 1px solid var(--shell-edge);
      border-radius: 22px;
      background: var(--shell);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .55), inset 0 0 0 2px rgba(0, 0, 0, .28);
      transform-origin: top left;
      transition: background-color .18s ease, border-color .18s ease;
    }
    .prototype-lab[data-orientation="portrait"] .device-frame { padding-bottom: 78px; }
    .prototype-lab[data-orientation="portrait-inverted"] .device-frame { padding-top: 78px; }
    .prototype-lab[data-orientation="landscape-cw"] .device-frame { padding-left: 78px; }
    .prototype-lab[data-orientation="landscape-ccw"] .device-frame { padding-right: 78px; }

    /* The Screen Canvas */
    #prototype-screen {
      position: relative;
      isolation: isolate;
      width: var(--screen-width);
      height: var(--screen-height);
      overflow: hidden;
      border: 2px solid #050605;
      border-radius: 2px;
      background: var(--paper);
      color: var(--ink);
      container-type: size;
      user-select: none;
    }
    #prototype-screen::after {
      content: "";
      position: absolute;
      z-index: 999;
      inset: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      border: 1px dashed rgba(215, 76, 33, .8);
      pointer-events: none;
      opacity: 0;
    }
    .prototype-lab[data-show-safe="true"] #prototype-screen::after { opacity: 1; }

    /* Physical Controls around the frame */
    .front-controls { position: absolute; display: flex; gap: 12px; }
    .front-key {
      width: 76px;
      height: 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--control-edge);
      border-radius: 8px;
      background: var(--control);
      color: #8c9188;
      font: 700 8px/1 -apple-system, sans-serif;
    }
    [data-orientation="portrait"] .front-controls { left: 50%; bottom: 24px; transform: translateX(-50%); }
    [data-orientation="portrait-inverted"] .front-controls { left: 50%; top: 24px; flex-direction: row-reverse; transform: translateX(-50%); }
    [data-orientation="landscape-cw"] .front-controls { left: 24px; top: 50%; flex-direction: column; transform: translateY(-50%); }
    [data-orientation="landscape-ccw"] .front-controls { right: 24px; top: 50%; flex-direction: column-reverse; transform: translateY(-50%); }

    .edge-control {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      border: 1px solid var(--control-edge);
      background: var(--control);
      color: #9aa096;
      font: 800 8px/1 -apple-system, sans-serif;
    }
    .x4-rocker { position: absolute; display: flex; gap: 2px; }
    .x4-rocker .edge-control { position: static; width: 14px; height: 50px; }
    [data-orientation="portrait"] .x4-rocker { right: -8px; top: 43%; flex-direction: column; }
    [data-orientation="portrait-inverted"] .x4-rocker { left: -8px; top: 43%; flex-direction: column-reverse; }
    [data-orientation="landscape-cw"] .x4-rocker { right: 36%; bottom: -8px; flex-direction: row-reverse; }
    [data-orientation="landscape-ccw"] .x4-rocker { left: 36%; top: -8px; flex-direction: row; }
    [data-orientation="portrait"] .x4-power { right: -7px; top: 18%; width: 13px; height: 31px; }
    [data-device="x3"] .x4-only, [data-device="x4"] .x3-only { display: none; }

    /* =====================================================================
       E-INK SCREEN UI ARCHITECTURE & STYLING
       ===================================================================== */
    .ink-app {
      position: absolute;
      inset: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      display: flex;
      flex-direction: column;
      background: var(--paper-pure);
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
    }
    .ink-app[data-type="serif"] { font-family: var(--serif); }

    /* Status Bar */
    .ink-status {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      border-bottom: 1px solid #111;
      background: var(--paper-pure);
      flex-shrink: 0;
    }
    .ink-status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .battery-icon {
      width: 24px;
      height: 12px;
      border: 1.5px solid #111;
      padding: 1.5px;
      border-radius: 2px;
      display: inline-flex;
      position: relative;
    }
    .battery-icon::after {
      content: "";
      position: absolute;
      right: -3.5px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: #111;
      border-radius: 0 1px 1px 0;
    }
    .battery-fill {
      width: 88%;
      height: 100%;
      background: #111;
    }

    /* Screen Main Body Area */
    .ink-body {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Bottom Navigation Tab Bar (5 Tabs) */
    .ink-tabbar {
      height: 56px;
      border-top: 1.5px solid #111;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--paper-pure);
      flex-shrink: 0;
    }
    .ink-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #444;
      cursor: pointer;
      position: relative;
      background: none;
      border: none;
    }
    .ink-tab-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .ink-tab-item span { font-size: 11px; font-weight: 600; }
    .ink-tab-item.active {
      color: #000;
      font-weight: 700;
    }
    .ink-tab-item.active::before {
      content: "";
      position: absolute;
      top: -1.5px;
      left: 18%;
      right: 18%;
      height: 3px;
      background: #000;
    }

    /* Shared Page Header */
    .page-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 20px 10px;
      border-bottom: 1px solid #111;
      flex-shrink: 0;
    }
    .page-title-row h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .page-title-row .date-sub {
      font-size: 13px;
      color: #444;
      font-weight: 500;
    }

    /* =====================================================================
       PAGE 1: 正在阅读 (Home Tab)
       ===================================================================== */
    .home-view {
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Hero Book Card */
    .hero-book-card {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .book-cover-box {
      width: 118px;
      height: 172px;
      border: 1.5px solid #111;
      position: relative;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 10px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    }
    .book-cover-box::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #ccc;
    }
    .cover-top-tag { font-size: 9px; letter-spacing: .1em; color: #666; }
    .cover-title-v {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--serif);
      line-height: 1.25;
      letter-spacing: .08em;
      margin-left: 6px;
    }
    .cover-author-b { font-size: 11px; color: #555; text-align: right; }

    .hero-info-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-meta-top h3 {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--serif);
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .hero-author {
      font-size: 13px;
      color: #444;
      margin-bottom: 8px;
    }
    .hero-chapter {
      font-size: 13px;
      color: #222;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
    }
    .hero-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .progress-bar-track {
      height: 5px;
      background: #e6e6e6;
      border: 1px solid #111;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: #111;
    }
    .progress-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-continue-read {
      height: 38px;
      background: #111;
      color: #fff !important;
      border: 1.5px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: .04em;
    }

    /* Milestone Badge Strip */
    .reading-milestone-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f4f3ed;
      border: 1px solid #111;
      font-size: 13px;
      font-weight: 600;
    }
    .milestone-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Recent Section */
    .recent-shelf-sec {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .sec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      padding-bottom: 4px;
      border-bottom: 1px solid #111;
    }
    .sec-header .more-link {
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .recent-list-row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #e0dfd8;
      cursor: pointer;
    }
    .recent-list-row:last-child { border-bottom: none; }
    .recent-num { font-size: 13px; font-weight: 700; color: #666; }
    .recent-book-title {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--serif);
      margin-bottom: 2px;
    }
    .recent-book-author { font-size: 12px; color: #555; }
    .recent-meta-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .recent-pct { font-size: 13px; font-weight: 700; }
    .recent-mini-bar {
      width: 46px;
      height: 4px;
      border: 1px solid #111;
      background: #e6e6e6;
    }
    .journal-view {
      padding: 8px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .paper-rule {
      height: 1px;
      background: #d8d6ce;
      width: 100%;
      flex-shrink: 0;
    }

    /* 1. Hero Reading Summary (Unboxed, clean Paper layout) */
    .journal-hero-stats {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
      padding: 2px 0 2px;
    }
    .jh-left .kicker { font-size: 11px; color: #555; margin-bottom: 2px; }
    .jh-left .main-number {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.05;
      font-family: var(--serif);
    }
    .jh-left .unit { font-size: 13px; font-weight: 600; margin-left: 2px; }
    .jh-left .sub-insight { font-size: 10px; color: #666; margin-top: 2px; }

    .jh-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      border-left: 1px solid #d8d6ce;
      padding-left: 14px;
    }
    .jh-stat-item strong { display: block; font-size: 14px; font-weight: 700; }
    .jh-stat-item small { font-size: 10px; color: #666; }

    /* 2. 7-Day Chart Block (Clean Paper layout) */
    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chart-sec-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .chart-sec-header h4 { font-size: 13px; font-weight: 700; }
    .chart-selected-detail { font-size: 11px; font-weight: 600; color: #111; }

    .chart-summary-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #333;
      padding-top: 1px;
    }

    /* 3. 24h Hourly Intensity Histogram Block */
    .daypart-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .daypart-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      font-weight: 700;
    }
    .daypart-sub { font-size: 11px; font-weight: 600; color: #111; }

    .dayparts-breakdown-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 3px;
    }
    .dp-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 2px;
      background: #f7f6f1;
      border: 1px solid #111;
      border-radius: 2px;
      font-size: 9px;
    }
    .dp-pill.primary {
      background: #111;
      color: #fff;
    }
    .dp-pill strong { font-size: 10px; font-weight: 800; }
    .dp-pill small { font-size: 8px; opacity: 0.85; }

    /* 4. Books Read This Week Block */
    .week-books-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .week-books-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      font-weight: 700;
      padding-bottom: 2px;
    }

      function renderSvg7DayChart() {
        const chartW = 440;
        const baselineY = 110;
        const colW = chartW / 7;
        const barWidth = 26;
        const maxBarH = 80;

        const bars = rawDays.map((d, i) => {
          const cx = Math.round(colW * i + colW / 2);
          const isAct = i === selectedBarDay;
          const h = d.mins > 0 ? Math.max(4, Math.round(d.mins / maxVal * maxBarH)) : 0;
          const barY = baselineY - h;
          const barX = Math.round(cx - barWidth / 2);

          const valSvg = d.mins > 0
            ? `<text x="${cx}" y="${barY - 4}" text-anchor="middle" font-size="10" font-weight="${isAct ? '800' : '700'}" fill="#111">${d.mins}</text>`
            : '';

          const barSvg = h > 0
            ? (isAct
                ? `<rect x="${barX - 2}" y="${barY - 2}" width="${barWidth + 4}" height="${h + 2}" fill="#fff" stroke="#111" stroke-width="1.5"/><rect x="${barX}" y="${barY}" width="${barWidth}" height="${h}" fill="#111"/>`
                : `<rect x="${barX}" y="${barY}" width="${barWidth}" height="${h}" fill="#111"/>`
              )
            : `<line x1="${cx - 3}" y1="${baselineY}" x2="${cx + 3}" y2="${baselineY}" stroke="#aaa" stroke-width="1.5"/>`;

          const labelSvg = `<text x="${cx}" y="${baselineY + 16}" text-anchor="middle" font-size="11" font-weight="${d.date === '今日' ? '800' : '600'}" text-decoration="${d.date === '今日' ? 'underline' : 'none'}" fill="#111">${d.date}</text>`;

          return `
            <g onclick="selectBarDay(${i})" style="cursor:pointer;">
              ${valSvg}
              ${barSvg}
              ${labelSvg}
            </g>
          `;
        }).join('');

        return `
          <svg viewBox="0 0 ${chartW} 132" width="100%" height="132" style="display:block;overflow:visible;">
            <line x1="0" y1="${baselineY}" x2="${chartW}" y2="${baselineY}" stroke="#111" stroke-width="1.5"/>
            ${bars}
          </svg>
        `;
      }

      function renderSvgHourlyChart() {
        const chartW = 440;
        const baselineY = 56;
        const colW = chartW / 24;
        const barWidth = 8;
        const maxBarH = 42;

        const bars = hourlyData.map((d, i) => {
          const cx = Math.round(colW * i + colW / 2);
          const isAct = d.hour === selectedHour;
          const barH = d.mins === 0 ? 1 : d.mins === 1 ? 3 : Math.max(3, Math.round(d.mins / 32 * maxBarH));
          const barY = baselineY - barH;
          const barX = Math.round(cx - barWidth / 2);

          const valSvg = d.mins > 0
            ? `<text x="${cx}" y="${barY - 3}" text-anchor="middle" font-size="8" font-weight="${isAct ? '800' : '700'}" fill="#111">${d.mins}m</text>`
            : '';

          const barSvg = d.mins > 0
            ? (isAct
                ? `<rect x="${barX - 1.5}" y="${barY - 1.5}" width="${barWidth + 3}" height="${barH + 1.5}" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="${barX}" y="${barY}" width="${barWidth}" height="${barH}" fill="#111" rx="1"/>`
                : `<rect x="${barX}" y="${barY}" width="${barWidth}" height="${barH}" fill="#111" rx="1"/>`
              )
            : `<line x1="${cx - 2}" y1="${baselineY}" x2="${cx + 2}" y2="${baselineY}" stroke="#bbb" stroke-width="1"/>`;

          return `
            <g onclick="selectHourlySlot(${d.hour})" style="cursor:pointer;">
              ${valSvg}
              ${barSvg}
            </g>
          `;
        }).join('');

        const ticks = `
          <text x="0" y="${baselineY + 14}" font-size="9" font-weight="700" fill="#666">00:00</text>
          <text x="${Math.round(chartW * 6 / 24)}" y="${baselineY + 14}" text-anchor="middle" font-size="9" font-weight="700" fill="#666">06:00</text>
          <text x="${Math.round(chartW * 12 / 24)}" y="${baselineY + 14}" text-anchor="middle" font-size="9" font-weight="700" fill="#666">12:00</text>
          <text x="${Math.round(chartW * 18 / 24)}" y="${baselineY + 14}" text-anchor="middle" font-size="9" font-weight="700" fill="#666">18:00</text>
          <text x="${chartW}" y="${baselineY + 14}" text-anchor="end" font-size="9" font-weight="700" fill="#666">23:59</text>
        `;

        return `
          <svg viewBox="0 0 ${chartW} 76" width="100%" height="76" style="display:block;overflow:visible;">
            <line x1="0" y1="${baselineY}" x2="${chartW}" y2="${baselineY}" stroke="#111" stroke-width="1.2"/>
            ${bars}
            ${ticks}
          </svg>
        `;
      }

      function render() {
        if (currentScreen === "home") appRoot.innerHTML = renderHomeScreen();
        else if (currentScreen === "journal") appRoot.innerHTML = renderJournalScreen();
        else if (currentScreen === "extended") appRoot.innerHTML = renderExtendedScreen();
        else if (currentScreen === "detail") appRoot.innerHTML = renderDetailScreen();

        // Bind bottom nav click events inside the screen

            const target = item.dataset.nav;
            if (target === "home") switchScreen("home");
            else if (target === "journal") switchScreen("journal");
          });
        });
      }

      // Sidebar Mode Switchers
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentMode = btn.dataset.mode;
          updateExpl();
          render();
        });
      });

      // Sidebar Screen Switchers
      document.querySelectorAll(".screen-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchScreen(btn.dataset.screen);
        });
      });

      // Rig Controls Handling
      function logicalCanvas(device) {
        const [panelWidth, panelHeight] = DEVICE_PROFILES[device].panel;
        return [panelHeight, panelWidth]; // portrait swap
      }

      function syncScale() {
        frame.style.transform = "none";
        const naturalWidth = frame.offsetWidth;
        const naturalHeight = frame.offsetHeight;
        const scale = Math.min((viewport.clientWidth - 48) / naturalWidth, (viewport.clientHeight - 48) / naturalHeight, 1);
        frame.style.transform = `scale(${Math.max(scale, .1)})`;
        sizer.style.width = `${naturalWidth * scale}px`;
        sizer.style.height = `${naturalHeight * scale}px`;
      }

      function applyConfiguration() {
        const device = deviceSelect.value;
        const [width, height] = logicalCanvas(device);
        const safe = DEVICE_PROFILES[device].safe;

        lab.dataset.device = device;
        lab.dataset.shell = shellSelect.value;
        lab.dataset.showSafe = String(safeToggle.checked);
        lab.style.setProperty("--screen-width", `${width}px`);
        lab.style.setProperty("--screen-height", `${height}px`);
        ["top", "right", "bottom", "left"].forEach((edge, index) => lab.style.setProperty(`--safe-${edge}`, `${safe[index]}px`));

        appRoot.dataset.type = typeSelect.value;
        document.querySelector("#canvas-readout").textContent = `${width} × ${height} 逻辑像素`;
        requestAnimationFrame(syncScale);
      }

      [deviceSelect, shellSelect, typeSelect, safeToggle].forEach(control => control.addEventListener("change", () => {
        applyConfiguration();
        render();
      }));

      new ResizeObserver(syncScale).observe(viewport);
      window.addEventListener("resize", syncScale);

      // Initialize
      applyConfiguration();
      updateExpl();
      render();
    })();
