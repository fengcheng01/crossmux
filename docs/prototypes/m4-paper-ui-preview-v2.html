<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨菲 M4 · 纸间 II · UI 设计稿</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Avenir Next", Futura, "Trebuchet MS", sans-serif;
      background: #111311;
      color: #e8e9e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
        #111311;
      background-size: 32px 32px;
    }

    button, select, input { font: inherit; }

    .prototype-lab {
      --accent: #e66f3a;
      --screen-width: 480px;
      --screen-height: 800px;
      --safe-top: 9px;
      --safe-right: 3px;
      --safe-bottom: 3px;
      --safe-left: 3px;
      --shell: #171917;
      --shell-edge: #343833;
      --control: #090a09;
      --control-edge: #555b53;
      --ink: #161714;
      --paper: #efeee7;
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr;
    }

    .prototype-lab[data-shell="white"] {
      --shell: #deddd6;
      --shell-edge: #f6f4eb;
      --control: #b8b8b0;
      --control-edge: #f5f3eb;
    }

    .lab-header {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 22px 28px;
      border-bottom: 1px solid #32352f;
      background: rgba(17, 19, 17, .94);
    }

    .identity { display: flex; gap: 14px; align-items: center; }
    .identity-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #6f756c;
      color: var(--accent);
      font: 800 13px/1 Georgia, serif;
      letter-spacing: -.08em;
      transform: rotate(-2deg);
    }
    .identity p, .identity h1 { margin: 0; }
    .identity p {
      color: #888e84;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .identity h1 {
      margin-top: 4px;
      font: 500 20px/1.1 "Avenir Next", Futura, sans-serif;
      letter-spacing: .02em;
    }

    .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    .control { display: grid; gap: 5px; }
    .control label {
      color: #7f857b;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .control select {
      min-height: 34px;
      padding: 0 34px 0 11px;
      border: 1px solid #44483f;
      border-radius: 0;
      background: #1c1f1b;
      color: #f1f1eb;
    }
    .safe-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid #44483f;
      background: #1c1f1b;
      color: #c8cbc2;
      font-size: 12px;
    }
    .safe-toggle input { accent-color: var(--accent); }

    .lab-body {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: 0;
    }

    .readout {
      padding: 24px 20px;
      border-right: 1px solid #32352f;
      background: rgba(20, 23, 20, .82);
    }
    .readout h2 {
      margin: 0 0 22px;
      color: #8d9388;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .metric {
      padding: 12px 0;
      border-top: 1px solid #343830;
    }
    .metric span { display: block; }
    .metric .label {
      color: #70766d;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .metric .value {
      margin-top: 5px;
      color: #edece4;
      font: 500 16px/1.25 "Avenir Next", Futura, sans-serif;
    }
    .metric .note {
      margin-top: 5px;
      color: #8a9086;
      font-size: 11px;
      line-height: 1.45;
    }
    .button-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
    .button-map span {
      padding: 6px 2px;
      border: 1px solid #484c44;
      color: #c6cac0;
      font: 700 9px/1 "Avenir Next", sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    .warning {
      margin: 18px 0 0;
      padding-left: 10px;
      border-left: 2px solid var(--accent);
      color: #969c91;
      font-size: 11px;
      line-height: 1.5;
    }

    .stage-viewport {
      position: relative;
      min-width: 0;
      min-height: 620px;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .stage-viewport::before {
      content: "NATIVE PIXEL CANVAS / AUTO SCALE";
      position: absolute;
      top: 15px;
      right: 19px;
      color: #555b52;
      font-size: 9px;
      letter-spacing: .16em;
    }
    .device-sizer { position: relative; }
    .device-frame {
      position: absolute;
      inset: 0 auto auto 0;
      width: max-content;
      height: max-content;
      padding: 34px;
      border: 1px solid var(--shell-edge);
      border-radius: 22px;
      background: var(--shell);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .48), inset 0 0 0 2px rgba(0, 0, 0, .28);
      transform-origin: top left;
      transition: background-color .18s ease, border-color .18s ease;
    }
    .prototype-lab[data-orientation="portrait"] .device-frame { padding-bottom: 78px; }
    .prototype-lab[data-orientation="portrait-inverted"] .device-frame { padding-top: 78px; }
    .prototype-lab[data-orientation="landscape-cw"] .device-frame { padding-left: 78px; }
    .prototype-lab[data-orientation="landscape-ccw"] .device-frame { padding-right: 78px; }

    #prototype-screen {
      position: relative;
      isolation: isolate;
      width: var(--screen-width);
      height: var(--screen-height);
      overflow: hidden;
      border: 2px solid #050605;
      border-radius: 3px;
      background: var(--paper);
      color: var(--ink);
      container-type: size;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    }
    #prototype-screen::after {
      content: "";
      position: absolute;
      z-index: 20;
      inset: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      border: 1px dashed rgba(215, 76, 33, .78);
      pointer-events: none;
      opacity: 0;
    }
    .prototype-lab[data-show-safe="false"] #prototype-screen::after { opacity: 1; }

    .screen-status {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 2px solid var(--ink);
      font: 700 15px/1 "Avenir Next", Futura, sans-serif;
      letter-spacing: .04em;
    }
    .battery { display: inline-flex; align-items: center; gap: 7px; }
    .battery-shape {
      width: 27px;
      height: 12px;
      padding: 2px;
      border: 2px solid currentColor;
    }
    .battery-shape::before { content: ""; display: block; width: 74%; height: 100%; background: currentColor; }
    .screen-layout { min-height: calc(100% - 42px); display: grid; grid-template-rows: auto 1fr auto; }
    .screen-heading { padding: 30px 28px 18px; }
    .screen-heading p, .screen-heading h2 { margin: 0; }
    .screen-heading p {
      font: 700 12px/1 "Avenir Next", Futura, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .screen-heading h2 { margin-top: 9px; font-size: 34px; line-height: 1.05; }
    .settings-list { padding: 0 28px; }
    .setting-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      min-height: 74px;
      border-top: 1px solid rgba(22, 23, 20, .34);
    }
    .setting-row:first-child { border-top: 2px solid var(--ink); }
    .setting-row strong { display: block; font-size: 20px; }
    .setting-row small { display: block; margin-top: 4px; font: 12px/1.3 "Avenir Next", sans-serif; color: #5c5e58; }
    .setting-value {
      min-width: 96px;
      padding: 9px 12px;
      border: 2px solid var(--ink);
      font: 700 13px/1 "Avenir Next", sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    .screen-hints {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 16px 22px 20px;
      font: 700 11px/1 "Avenir Next", Futura, sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    .screen-hints span { padding-top: 9px; border-top: 3px solid var(--ink); }

    [data-orientation^="landscape"] .screen-layout {
      grid-template-columns: .8fr 1.2fr;
      grid-template-rows: 1fr auto;
    }
    [data-orientation^="landscape"] .screen-heading { padding: 26px 24px; border-right: 2px solid var(--ink); }
    [data-orientation^="landscape"] .screen-heading h2 { font-size: 31px; }
    [data-orientation^="landscape"] .settings-list { padding: 20px 24px 0; }
    [data-orientation^="landscape"] .setting-row { min-height: 64px; }
    [data-orientation^="landscape"] .screen-hints { grid-column: 1 / -1; padding: 12px 22px 16px; }

    .front-controls { position: absolute; display: flex; gap: 12px; }
    .front-key {
      width: 76px;
      height: 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--control-edge);
      border-radius: 8px;
      background: var(--control);
      color: #8c9188;
      font: 700 8px/1 "Avenir Next", sans-serif;
    }
    [data-orientation="portrait"] .front-controls { left: 50%; bottom: 24px; transform: translateX(-50%); }
    [data-orientation="portrait-inverted"] .front-controls { left: 50%; top: 24px; flex-direction: row-reverse; transform: translateX(-50%); }
    [data-orientation="landscape-cw"] .front-controls { left: 24px; top: 50%; flex-direction: column; transform: translateY(-50%); }
    [data-orientation="landscape-ccw"] .front-controls { right: 24px; top: 50%; flex-direction: column-reverse; transform: translateY(-50%); }
    [data-orientation^="landscape"] .front-key { width: 16px; height: 76px; }

    .edge-control {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      border: 1px solid var(--control-edge);
      background: var(--control);
      color: #9aa096;
      font: 800 8px/1 "Avenir Next", sans-serif;
    }
    .x4-rocker { position: absolute; display: flex; gap: 2px; }
    .x4-rocker .edge-control { position: static; width: 14px; height: 50px; }
    [data-orientation="portrait"] .x4-rocker { right: -8px; top: 43%; flex-direction: column; }
    [data-orientation="portrait-inverted"] .x4-rocker { left: -8px; top: 43%; flex-direction: column-reverse; }
    [data-orientation="landscape-cw"] .x4-rocker { right: 36%; bottom: -8px; flex-direction: row-reverse; }
    [data-orientation="landscape-ccw"] .x4-rocker { left: 36%; top: -8px; flex-direction: row; }
    [data-orientation^="landscape"] .x4-rocker .edge-control { width: 50px; height: 14px; }

    [data-orientation="portrait"] .x4-power { right: -7px; top: 18%; width: 13px; height: 31px; }
    [data-orientation="portrait-inverted"] .x4-power { left: -7px; bottom: 18%; width: 13px; height: 31px; }
    [data-orientation="landscape-cw"] .x4-power { right: 18%; bottom: -7px; width: 31px; height: 13px; }
    [data-orientation="landscape-ccw"] .x4-power { left: 18%; top: -7px; width: 31px; height: 13px; }

    [data-orientation="portrait"] .x3-up { left: -8px; top: 40%; width: 14px; height: 62px; }
    [data-orientation="portrait"] .x3-down { right: -8px; top: 40%; width: 14px; height: 62px; }
    [data-orientation="portrait"] .x3-power { left: 50%; top: -7px; width: 38px; height: 13px; transform: translateX(-50%); }
    [data-orientation="portrait-inverted"] .x3-up { right: -8px; top: 40%; width: 14px; height: 62px; }
    [data-orientation="portrait-inverted"] .x3-down { left: -8px; top: 40%; width: 14px; height: 62px; }
    [data-orientation="portrait-inverted"] .x3-power { left: 50%; bottom: -7px; width: 38px; height: 13px; transform: translateX(-50%); }
    [data-orientation="landscape-cw"] .x3-up { left: 40%; top: -8px; width: 62px; height: 14px; }
    [data-orientation="landscape-cw"] .x3-down { left: 40%; bottom: -8px; width: 62px; height: 14px; }
    [data-orientation="landscape-cw"] .x3-power { right: -7px; top: 50%; width: 13px; height: 38px; transform: translateY(-50%); }
    [data-orientation="landscape-ccw"] .x3-up { left: 40%; bottom: -8px; width: 62px; height: 14px; }
    [data-orientation="landscape-ccw"] .x3-down { left: 40%; top: -8px; width: 62px; height: 14px; }
    [data-orientation="landscape-ccw"] .x3-power { left: -7px; top: 50%; width: 13px; height: 38px; transform: translateY(-50%); }

    [data-device="x3"] .x4-only, [data-device="x4"] .x3-only { display: none; }

    @media (max-width: 900px) {
      .lab-header { grid-template-columns: 1fr; align-items: start; }
      .controls { justify-content: flex-start; }
      .lab-body { grid-template-columns: 1fr; }
      .readout { border-right: 0; border-bottom: 1px solid #32352f; }
      .stage-viewport { min-height: 560px; }
    }
    @media (max-width: 560px) {
      .lab-header { padding: 18px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      .control select, .safe-toggle { width: 100%; }
      .stage-viewport { min-height: 500px; padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .device-frame { transition: none; } }

  <script>
    (() => {
      "use strict";

      const DEVICE_PROFILES = Object.freeze({
        m4: Object.freeze({name: "墨菲 M4", panel: [800, 480], product: "触屏 · 单色墨水屏", side: "Up / Down · 短按电源 Confirm"}),
        x4: Object.freeze({ name: "Xteink X4", panel: [800, 480], product: "4.3 in · 5.98 mm · ≈75 g", side: "Right rocker" }),
        x3: Object.freeze({ name: "Xteink X3", panel: [792, 528], product: "3.7 in · 4.98 mm · ≈58 g", side: "Left / right edges" })
      });
      const ORIENTATIONS = Object.freeze({
        portrait: Object.freeze({ swap: true, safe: [9, 3, 3, 3] }),
        "landscape-cw": Object.freeze({ swap: false, safe: [3, 9, 3, 3] }),
        "portrait-inverted": Object.freeze({ swap: true, safe: [3, 3, 9, 3] }),
        "landscape-ccw": Object.freeze({ swap: false, safe: [3, 3, 3, 9] })
      });
      const FRONT_BUTTONS = Object.freeze(["Back", "Confirm", "Left", "Right"]);

      const lab = document.querySelector(".prototype-lab");
      const frame = document.querySelector("#device-frame");
      const sizer = document.querySelector(".device-sizer");
      const viewport = document.querySelector(".stage-viewport");
      const deviceSelect = document.querySelector("#device-select");
      const orientationSelect = document.querySelector("#orientation-select");
      const shellSelect = document.querySelector("#shell-select");
      const safeToggle = document.querySelector("#safe-toggle");

      function logicalCanvas(device, orientation) {
        const [panelWidth, panelHeight] = DEVICE_PROFILES[device].panel;
        return ORIENTATIONS[orientation].swap ? [panelHeight, panelWidth] : [panelWidth, panelHeight];
      }

      function syncScale() {
        frame.style.transform = "none";
        const naturalWidth = frame.offsetWidth;
        const naturalHeight = frame.offsetHeight;
        const scale = Math.min((viewport.clientWidth - 48) / naturalWidth, (viewport.clientHeight - 48) / naturalHeight, 1);
        frame.style.transform = `scale(${Math.max(scale, .1)})`;
        sizer.style.width = `${naturalWidth * scale}px`;
        sizer.style.height = `${naturalHeight * scale}px`;
      }

      function applyConfiguration() {
        const device = deviceSelect.value;
        const orientation = orientationSelect.value;
        const profile = DEVICE_PROFILES[device];
        const [width, height] = logicalCanvas(device, orientation);
        const safe = device === "m4" ? [0, 0, 0, 0] : ORIENTATIONS[orientation].safe;

        lab.dataset.device = device;
        lab.dataset.orientation = orientation;
        lab.dataset.shell = shellSelect.value;
        lab.dataset.showSafe = String(safeToggle.checked);
        lab.style.setProperty("--screen-width", `${width}px`);
        lab.style.setProperty("--screen-height", `${height}px`);
        ["top", "right", "bottom", "left"].forEach((edge, index) => lab.style.setProperty(`--safe-${edge}`, `${safe[index]}px`));

        document.querySelector("#target-readout").textContent = profile.name;
        document.querySelector("#product-readout").textContent = profile.product;
        document.querySelector("#canvas-readout").textContent = `${width} × ${height}`;
        document.querySelector("#safe-readout").textContent = safe.join(" / ");
        document.querySelector("#side-readout").textContent = profile.side;
        document.querySelector("#page-readout").textContent = device === "x3"
          ? "Left raw Up · Right raw Down"
          : device === "m4" ? "触屏导航 · Up / Down · Confirm" : "Up = PageBack · Down = PageForward";
        requestAnimationFrame(syncScale);
      }

      [deviceSelect, orientationSelect, shellSelect, safeToggle].forEach(control => control.addEventListener("change", applyConfiguration));
      new ResizeObserver(syncScale).observe(viewport);
      window.addEventListener("resize", syncScale);

      const expectedCanvases = Object.freeze({
        "m4/portrait": [480,800], "m4/landscape-cw": [800,480], "m4/portrait-inverted": [480,800], "m4/landscape-ccw": [800,480],
        "x4/portrait": [480, 800], "x4/landscape-cw": [800, 480],
        "x4/portrait-inverted": [480, 800], "x4/landscape-ccw": [800, 480],
        "x3/portrait": [528, 792], "x3/landscape-cw": [792, 528],
        "x3/portrait-inverted": [528, 792], "x3/landscape-ccw": [792, 528]
      });
      Object.entries(expectedCanvases).forEach(([key, expected]) => {
        const [device, orientation] = key.split("/");
        console.assert(logicalCanvas(device, orientation).join("×") === expected.join("×"), `Canvas mismatch: ${key}`);
      });
      console.assert(ORIENTATIONS.portrait.safe.join("/") === "9/3/3/3", "Portrait safe margins changed");
      console.assert(ORIENTATIONS["landscape-cw"].safe.join("/") === "3/9/3/3", "CW safe margins changed");
      console.assert(ORIENTATIONS["portrait-inverted"].safe.join("/") === "3/3/9/3", "Inverted safe margins changed");
      console.assert(ORIENTATIONS["landscape-ccw"].safe.join("/") === "3/3/3/9", "CCW safe margins changed");
      console.assert(FRONT_BUTTONS.join("/") === "Back/Confirm/Left/Right", "Default front button order changed");

      applyConfiguration();
    })();
  </script>

const books=[['山茶文具店','小川糸','第六章 · 夏日来信',42],['人间草木','汪曾祺','草木春秋',68],['悉达多','赫尔曼·黑塞','觉醒',23],['长日将尽','石黑一雄','尚未开始',0],['苏东坡传','林语堂','已经读完',100],['瓦尔登湖','亨利·戴维·梭罗','湖畔',14],['冬牧场','李娟','冬日行路',0],['沉默的大多数','王小波','读书与生活',31],['额尔古纳河右岸','迟子建','清晨',0],['浮生六记','沈复','闲情记趣',100],['万物有灵且美','吉米·哈利','乡间',8],['远山淡影','石黑一雄','第一章',0]];
const allApps=[['文件传输','transfer'],['微信读书','type'],['AirPage','air'],['阅读统计','stats'],['数独','grid'],['五子棋','chess'],['推箱子','apps'],['计算器','calculator'],['待机显示','clock'],['倒计时','timer'],['电子木鱼','apps']];
let page='home',sample='normal',book=0,day=6,filter='全部',catalogPage=0,appPage=0,type='editorial';
const settings={'显示与灯光':'自然光 · 35%','阅读':'宋体 · 24 px','操作':'触屏与按键','设备与系统':'简体中文 · 24 小时制'};
const choices={'显示与灯光':['自然光 · 35%','暖光 · 50%','关闭灯光'],'阅读':['宋体 · 24 px','宋体 · 26 px','黑体 · 24 px'],'操作':['触屏与按键','触屏翻页','按键翻页'],'设备与系统':['简体中文 · 24 小时制','简体中文 · 12 小时制']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wide=()=>document.querySelector('.prototype-lab').dataset.orientation.startsWith('landscape');
const available=()=>sample==='empty'?[]:sample==='single'?books.slice(0,1):sample==='many'?books:books.slice(0,5);
const current=()=>sample==='long'?['那些在漫长岁月里陪伴我们走过四季的故事','亨利·戴维·梭罗 / 示例长作者名','第三章 · 那些值得记住的日子',42]:books[book];
const head=(title,right)=>`<header class="page-head"><h2>${title}</h2><small>${right}</small></header>`;
const empty=(title,desc,action='前往书库',to='library')=>`<section class="empty"><p class="eyebrow">从一页开始</p><h2>${title}</h2><p>${desc}</p><button data-go="${to}">${action} →</button></section>`;
function cover(b){return `<div class="cover" aria-label="无封面时的文字封面示意"><span class="cover-top">CROSSMUX · ${String(book+1).padStart(2,'0')}</span><span class="cover-title">${esc(b[0].length>8?b[0].slice(0,7)+'…':b[0])}</span><span class="cover-stamp" aria-hidden="true">在<br>读</span><span class="cover-bottom">${esc(b[1])}</span></div>`;}
function home(){if(sample==='empty')return `<div class="page">${empty('给自己一点阅读时间','传入第一本书，<br>从你喜欢的那一页开始。')}</div>`;const b=current(),recent=available().map((b,i)=>({b,i})).filter(x=>x.i!==book).slice(0,2);return `<div class="page home-page"><div class="home-kicker"><span>正在读</span><span>09.13 · 星期日</span></div><section class="home-main">${cover(b)}<div class="book-info ${sample==='long'?'long-title':''}"><h2 title="${esc(b[0])}">${esc(b[0])}</h2><p class="author" title="${esc(b[1])}">${esc(b[1])}</p><p class="chapter">${esc(b[2])}</p><div class="progress"><i style="width:${b[3]}%"></i></div><div class="progress-meta"><span>${b[3]===100?'已经读完':'读到这里'}</span><span>${b[3]}%</span></div><button class="continue" data-go="reader">${b[3]===100?'再次翻开':'继续阅读'}<span>→</span></button></div></section><div class="reading-note"><span class="mini-bookmark" aria-hidden="true"></span>${b[3]===0?'新的一本，从第一页开始。':b[3]===100?'已经读完，随时可以再翻开。':'这本书，已读 3 天 · 86 分钟'}</div>${recent.length?`<section class="recent-section"><div class="section-label"><span>最近翻过</span><button data-go="library">书库 →</button></div>${recent.map(({b,i},slot)=>`<button class="recent-row" data-book="${i}"><span class="number">${String(slot+1).padStart(2,'0')}</span><span class="recent-title">${esc(b[0])}<small>${esc(b[1])}</small></span><span class="recent-meta">${b[3]}%</span></button>`).join('')}</section>`:'<section class="recent-section"><div class="section-label"><span>你的第一本书</span><button data-go="library">书库 →</button></div></section>'}<div class="home-tail">${available().length} 本书 · 本地书库</div></div>`;}

function stats(){const values=sample==='empty'?[0,0,0,0,0,0,0]:[18,0,32,24,15,46,28],total=values.reduce((a,b)=>a+b,0),days=values.filter(x=>x>0).length,max=Math.max(1,...values),peak=values.indexOf(max);return `<div class="page stats-page">${head('阅读手账','09.07 — 09.13')}<section class="stats-lead"><div class="stats-period">这一周，读了</div><div class="stats-value">${total}<small>分钟</small></div><div class="stats-context">今日 ${values[6]} 分钟 · 阅读 ${days} 天</div></section><section class="stats-chart-block"><div class="chart-header"><span>七天的阅读节奏</span><span aria-live="polite">${day===6?'今日':'09.'+String(day+7).padStart(2,'0')} · ${values[day]} 分钟</span></div><div class="chart">${values.map((v,i)=>`<button class="bar-column ${day===i?'active':''}" data-day="${i}" aria-pressed="${day===i}" aria-label="9月${i+7}日，${v}分钟"><span class="bar-value">${v||'—'}</span><i class="bar" style="height:${Math.max(2,v/max*(wide()?83:120))}px"></i><span class="bar-date">${i===6?'今日':['一','二','三','四','五','六'][i]}</span></button>`).join('')}</div><div class="insight">${days?`这一周，有 ${days} 天留给了阅读。`:'每一页，都值得记录。'}<small>${days?`周${['一','二','三','四','五','六','日'][peak]}读得最久，累计 ${max} 分钟。`:'开始阅读后，这里会留下你的阅读节奏。'}</small></div></section><footer class="journal-footer"><span>${days?'最近阅读 · 今日 21:00':'尚无阅读记录'}</span><button data-app="阅读明细">查看明细 →</button></footer></div>`;}
function settingsPage(){const entries=[['显示与灯光','休眠画面 · 主题 · 灯光 · 刷新'],['阅读','字体排版 · 阅读方向 · 词典'],['操作','按键翻页 · 触控区域 · 电源键'],['设备与系统','日期时间 · 语言 · 缓存 · 固件']];return `<div class="page">${head('设置','墨菲 M4')}<div class="settings-items">${entries.map(([name,desc],i)=>`<button class="setting-item" data-setting="${name}"><span class="number">0${i+1}</span><span><strong>${name}</strong><small>${desc}</small></span><span class="arrow">›</span></button>`).join('')}</div><footer class="version"><span>CrossMux</span><span>纸间 II · 设计预览</span></footer></div>`;}
function apps(){const entries=sample==='many'?allApps:allApps.slice(0,8),count=wide()?8:9,pages=Math.max(1,Math.ceil(entries.length/count));appPage=Math.min(appPage,pages-1);return `<div class="page">${head('应用',`${entries.length} 个入口`)}<p class="apps-intro">传书、阅读服务与小工具</p><div class="apps-grid">${entries.slice(appPage*count,(appPage+1)*count).map(([name,ico])=>`<button class="app" data-app="${name}">${icon(ico)}<span>${name}</span></button>`).join('')}</div><footer class="apps-bottom"><span>工具随手可用</span>${pages>1?pager('apps',appPage,pages):'<span>01 / 01</span>'}</footer></div>`;}
function reader(){const b=current();return `<div class="page"><div class="reader-top"><button data-go="home">‹ 返回</button><span>阅读示意</span><button data-setting="阅读">排版</button></div><h3 class="reader-title">${esc(b[0])}</h3><p class="reader-text">午后的光落在书桌上，窗外的树影缓缓移动。我把读到一半的书重新翻开，纸页之间，夹着昨天留下的书签。那些尚未读完的句子，像一条安静的小路，等着我继续往前走。</p><p class="reader-text">时间并没有因此停下来，但这一刻不必急着赶路。读过的每一页，都让日常多出一点可以回望的东西。</p><footer class="reader-footer"><span>正文为原创示例</span><button data-reader-next>128 / 304 · 下一页 →</button></footer></div>`;}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#design-note').textContent=notes[page]||notes.home;root.dataset.type=type;root.innerHTML=`<div class="status"><span>21:36</span><span class="status-right"><span>82%</span><i class="battery-shape" aria-hidden="true"></i></span></div><div class="body">${({home,library,stats,settings:settingsPage,apps,reader}[page]||home)()}</div>${page==='reader'?'':`<nav class="nav" aria-label="主导航">${Object.entries(titles).map(([key,title])=>`<button data-go="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${icon(key)}<span>${title}</span></button>`).join('')}</nav>`}`;}
function sheet(title,options,setting){const previous=document.activeElement,shade=document.createElement('div');shade.className='sheet-shade';shade.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sheet-head"><span>${esc(title)}</span><button data-close>关闭 ×</button></header>${options?`<div class="sheet-options">${options.map(x=>`<button data-option="${esc(x)}">${esc(x)}<span>${settings[setting]===x?'✓':'›'}</span></button>`).join('')}</div><p>当前：${esc(settings[setting]||'请选择传输方式')} · 仅在本次预览中生效</p>`:'<p>这是入口与弹层的设计示意。工具功能和阅读明细以固件中的实际功能为准。</p>'}</section>`;root.append(shade);shade.querySelector('[data-close]').focus();const close=()=>{shade.remove();previous?.focus()};shade.addEventListener('click',e=>{if(e.target===shade||e.target.closest('[data-close]')){close();return}const option=e.target.closest('[data-option]');if(option){settings[setting]=option.dataset.option;close();render();root.querySelector(`[data-setting="${setting}"]`)?.focus()}});shade.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const b=[...shade.querySelectorAll('button')],first=b[0],last=b.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});}
document.addEventListener('click',e=>{if(e.target.closest('.sheet-shade'))return;const p=e.target.closest('[data-page],[data-go]');if(p){const next=p.dataset.page||p.dataset.go;if(next==='transfer'){sheet('传入书籍',['Wi-Fi 传书','USB 数据线'],'传入书籍');return}if(next==='all-books'){filter='全部';page='library';catalogPage=0}else page=next;render();return}const b=e.target.closest('[data-book],[data-read-book]');if(b){book=Number(b.dataset.book??b.dataset.readBook);page=b.hasAttribute('data-read-book')?'reader':'home';render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;catalogPage=0;render();return}const d=e.target.closest('[data-day]');if(d){day=Number(d.dataset.day);render();root.querySelector(`[data-day="${day}"]`)?.focus({preventScroll:true});return}const pg=e.target.closest('[data-pager]');if(pg&&!pg.disabled){if(pg.dataset.pager==='library')catalogPage+=Number(pg.dataset.delta);else appPage+=Number(pg.dataset.delta);render();return}const st=e.target.closest('[data-setting]');if(st){sheet(st.dataset.setting,choices[st.dataset.setting],st.dataset.setting);return}const a=e.target.closest('[data-app]');if(a){if(a.dataset.app==='文件传输')sheet('传入书籍',['Wi-Fi 传书','USB 数据线'],'传入书籍');else sheet(a.dataset.app);return}if(e.target.closest('[data-reader-next]')){const t=root.querySelector('[data-reader-next]');t.textContent=t.textContent.startsWith('128')?'129 / 304 · 下一页 →':'128 / 304 · 下一页 →'}});
document.querySelector('#sample-select').addEventListener('change',e=>{sample=e.target.value;book=0;catalogPage=0;appPage=0;render()});
document.querySelector('#type-select').addEventListener('change',e=>{type=e.target.value;render()});
document.querySelector('#orientation-select').addEventListener('change',render);
render();
})();
</script>
</body>
</html>
